name: invastro
description: "A new Flutter project"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  get_it: ^9.2.1
  pusher_channels_flutter: ^2.6.0
  cached_network_image: ^3.4.1
  flutter_easyloading: ^3.0.5
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  dio: ^5.9.2
  permission_handler: ^12.0.3
  image_cropper: ^12.2.1
  flutter_widget_from_html: ^0.15.2
  dotted_border: ^3.1.0
  flutter_screenutil: ^5.9.3
  webview_flutter: ^4.14.1
  dropdown_search: ^5.0.6

  dio_cache_interceptor: ^4.0.6
  carousel_slider: ^5.1.2
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.2.4
  another_flushbar: ^1.12.32
  flutter_ringtone_player: ^4.0.0+4
  vibration: ^3.1.8
  photo_view: ^0.15.0
  dismissible_page: ^1.0.2
  flutter_staggered_animations: ^1.1.1
  smooth_page_indicator: ^2.0.1
  flutter_displaymode: ^0.7.0
  flutter_bloc: ^9.1.1
  country_code_picker: ^3.4.1
  image_picker: ^1.2.2
  pull_to_refresh: ^2.0.0
  flutter_secure_storage: ^10.1.0
  internet_connection_checker: ^3.0.1
  flutter_slidable: ^3.1.2
  roundcheckbox:
    git: https://github.com/Mohamed-Ayman-Dev/round_check_box_updated.git
  firebase_messaging: ^16.2.0
  firebase_analytics: ^12.3.0
  firebase_crashlytics: ^5.2.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6
  skeletonizer: ^2.1.3
  share_plus: ^13.1.0
  firebase_core: ^4.7.0
  pin_code_fields: ^8.0.1
  navigation_history_observer: ^1.1.1
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  intl: ^0.20.2

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon-1024.png
  android_12:
    image: assets/android12+splash.png
    icon_background_color: "#FFFFFF"

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon-1024.png"
  color: "#FFFFFF"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svg/
    - assets/fonts/
    - assets/
  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/almarai/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/almarai/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/almarai/Almarai-Bold.ttf
          weight: 600
        - asset: assets/fonts/almarai/Almarai-ExtraBold.ttf
          weight: 700
flutter_intl:
  enabled: true
